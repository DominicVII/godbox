  if(tab=='inventions'){const it=civ.items[+rest];if(!it)return'';return `<h3 style=margin:2px 0>${esc(it.name)}</h3>`+pre(V.describeInvention(civ,it.id))+`<br><b>Made from:</b> ${it.parts.map(x=>x===it.id?'itself':civ.items[x]?`<span class=lk data-cx="inventions:i${x}">${esc(civ.items[x].name)}</span>`:'?').join(' + ')||'—'}<br><b>Used in:</b> ${civ.items.filter(o=>o.id!==it.id&&o.parts.includes(it.id)).slice(0,25).map(o=>`<span class=lk data-cx="inventions:i${o.id}">${esc(o.name)}</span>`).join(', ')||'—'}`}
  if(tab=='genes'){const c=civ.people[+rest];if(!c)return'';const p=findP(+rest),ap=V.personAppearance(civ,c.id),ph=GN.phenotype(c.g);
   return `<h3 style=margin:2px 0>${esc(p?p.name:c.name)}</h3>${sw(ap.skinColor)} skin ${sw(ap.hairColor)} ${ph.hair} hair ${sw(ap.eyeColor)} ${ph.eye} eyes · ${ph.heightCm} cm, ${ph.build} build<br>Intellect ${ph.intel.toFixed(2)} · strength ${ph.strength.toFixed(2)} · longevity ${ph.longevity.toFixed(2)} · plague resistance ${ph.resist.toFixed(2)}${ph.disease?' · <b>has the wasting sickness</b>':''}<br>Clothing: ${esc(ap.clothing.style)} ${esc(ap.clothing.garment)}`+pre('Genome: '+GN.describeGenome(c.g))+(p?familyTree(p):'')+(p?`<span class=lk data-cx="people:${p.id}">→ full person page</span>`:'')+`<br><code style="font-size:10px;word-break:break-all;opacity:.55">${c.g}</code>`}
  if(tab=='history'){if(id=='chron')return '<h3 style=margin:2px 0>Chronicle of the peoples</h3>'+civ.chron.slice(-400).reverse().map(e=>esc(e.text)).join('<br>');
   if(id=='tech')return '<h3 style=margin:2px 0>Inventions timeline</h3>'+Object.entries(civ.milestones).sort((a,b)=>a[1].year-b[1].year).map(([k,v])=>`Year ${v.year}: <b>${k}</b> — <span class=lk data-cx="inventions:i${v.item}">${esc(civ.items[v.item]?civ.items[v.item].name:'?')}</span> in <span class=lk data-cx="nations:n${v.nation}">${esc(N[v.nation]?N[v.nation].name:'?')}</span>${v.person!=null?' by '+esc(fullNm(v.person)):''}`).join('<br>')}
  return''}};
function registerCivLayer(){HK.layer=civLayer;civRefresh();houseVer++}

// ================= HUD =================
const hud=document.getElementById('hud'),kd=document.getElementById('kd'),ins=document.getElementById('ins'),altD=document.getElementById('alt');
function level(){return cam.alt>900?'Orbit':cam.alt>120?'Region':'Ground'}
function fmtAlt(a){const km=a*6.371;return km>=1?km.toFixed(km<10?1:0)+' km':(km*1000|0)+' m'}
let fps=60,frames=0,fpsT=0;
function faithGauge(){const G=mind.gods(),f=G.followers,tot=Math.max(1,P.length);const rows=[['the true god (you)','#ffd77a',f.true||0]];for(const id in G.byGod){const g=G.byGod[id];rows.push([`${g.name} <span style=opacity:.6>(${g.kind}${g.domain?', '+g.domain:''})</span>`,g.color||'#a8f',g.followers])}rows.push(['no god','#777',f.none||0]);
 return '<hr style="border-color:#333"><b>Faith</b><br>'+rows.map(([n,c,v])=>`<span class=bar style="width:${Math.max(1,v/tot*120)}px;background:${c}"></span> ${v} · ${n}`).join('<br>')}
function drawHUD(){const alive=kings.filter(k=>!k.dead&&k.pop>0);
 hud.innerHTML=`<b>GODBOX · EARTH</b> — you are their one true god. World ${ages}; it never ends unless you end it.<br>Year ${yr|0}. Population ${P.length}. Homes ${houses.length}. Kingdoms ${alive.length}.<br>Time ×${speed}${paused?' (paused)':''} · ${fps|0} fps · ${level()} view${civ?`<br>Era: <span class=lk data-cx="history:tech">${civEra()}</span> · ${civ.items.filter(i=>!i.base).length} inventions · ${civ.nations.filter(n=>n.alive&&n.caps&&n.caps.power).length} electrified nations`:''}`;
 kd.style.top=(hud.offsetHeight+16)+'px';kd.innerHTML='<b>Kingdoms</b><br>'+(alive.map(k=>`<span style=color:${k.c};cursor:pointer data-k=${kings.indexOf(k)} title='fly there'>■</span> <span class=lk style=color:${k.c} data-cx="nations:${k.civId!=null?'n'+k.civId:k.id}">${k.name}</span>: ${k.pop} people, ${k.houses.length} homes, ${k.food|0} food, ${k.wood|0} wood${k.war.size?' ⚔ '+[...k.war].filter(o=>!o.dead).map(o=>o.name).join(','):''}`).join('<br>')||'<i>The world is empty. Place a human or a tribe.</i>')+(mind.real?faithGauge():'');
 kd.querySelectorAll('[data-k]').forEach(s=>s.onclick=()=>{const k=kings[s.dataset.k];if(k.cx!=null){follow=false;flyTo(k.cx,k.cy,150)}});
 altD.innerHTML=`Altitude ${fmtAlt(cam.alt)} · ${level()}<br>${(90-cam.ty/TH*180).toFixed(1)}°, ${(cam.tx/TW*360-180).toFixed(1)}°`;
 if(sel){ins.style.display='block';const s=sel,age=s.age|0;const desc=mind.describe(s);const g=mind.god(s);
  ins.innerHTML=(s.dead?`<div style="text-align:center;border:1px solid #886;padding:6px;margin-bottom:6px;background:#1a1712"><b style=color:#f99>✝ In memory of</b><br><b>${s.name}</b><br>Year ${s.born|0} – Year ${s.died|0} · lived ${age} years<br>${s.cause?'Died of '+s.cause:''}<br>${s.kids} children · ${s.kills} killed${g?'<br>Kept faith with '+g:''}</div>`:'')+
  `<b style=color:${s.k?s.k.c:'#ccc'}>${s.name}</b>, ${s.k?'of '+kLink(s.k):'belonging to no kingdom'} <span class=lk data-cx="people:${s.id}">📖</span><br>Age ${age}. Health ${Math.max(0,s.hp)|0}. Hunger ${s.hunger|0}${s.sick?'. <span style=color:#7f3>Sick.</span>':''}<br>Strength ${s.str.toFixed(1)}. Kindness ${s.kind.toFixed(1)}. Faith ${Math.min(1,s.faith).toFixed(2)} (${mind.faithOf(s)})${g?`<br>Worships: <b>${g}</b>`:''}<br>Doing: ${s.job}${s.mind?' (wants: '+s.mind.action+')':''}. Children ${s.kids}. Kills ${s.kills}<br><i>"${s.thought}"</i>`+
  (desc?`<hr><div style="font-size:12px">${desc}</div>`:'')+`<div style="margin:6px 0">${s.dead?'':`<button class=btn id=fbtn>${follow?'⏹ Stop following':'🎥 Follow'}</button> `}<button class=btn id=gbtn>📍 Go to</button> <button class=btn id=xbtn>✕</button></div><b>Life so far</b><br><div style='font-size:12px'>${s.life.slice().reverse().join('<br>')}</div>`;
  const fb=document.getElementById('fbtn');if(fb)fb.onclick=toggleFollow;document.getElementById('gbtn').onclick=()=>{follow=false;flyTo(s.x,s.y,25)};document.getElementById('xbtn').onclick=()=>{sel=null;follow=false}}else ins.style.display='none'}

// ================= LOOP =================
let last=performance.now(),acc1=0,acc2=0,acc3=0,acc4=0,lastAltBand=-1;
function loop(now){const rdt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;frames++;fpsT+=rdt;if(fpsT>=.5){fps=frames/fpsT;frames=0;fpsT=0}
 const dt=rdt*60;if(!paused){if(speed<1)step(dt*speed);else for(let k=0;k<speed;k++)step(dt)}
 if(sunLock)sunDir.copy(sunLock);else sunDir.set(Math.cos(simT*.004),.25,Math.sin(simT*.004)).normalize();sun.position.copy(sunDir).multiplyScalar(5000);sunMesh.position.copy(sunDir).multiplyScalar(3e5);sunGlow.position.copy(sunMesh.position);
 updateCamera(rdt);
 acc1+=rdt;acc2+=rdt;acc3+=rdt;acc4+=rdt;
 if(acc1>.5){acc1=0;updateOwners();burning=[];for(let i=0;i<NT;i++)if(F[i]>0&&burning.length<3000){const x=i%TW,y=(i/TW)|0;if(dist(x,y,cam.tx,cam.ty)<40)burning.push(i)}}
 const band=Math.round(Math.log(cam.alt)*3);if(band!==lastAltBand){lastAltBand=band;dirtyC=true}
 if(dirtyH)rebuildHeights();if(dirtyC&&acc2>.25){acc2=0;rebuildColors()}
 if(acc3>1){acc3=0;drawMini();civRefresh()}if(acc4>.2){acc4=0;drawHUD()}
 const nearG=cam.alt<500;[treeOak,treePine,farmIM].forEach(m=>m.visible=nearG);if(nearG&&(treesDirty||treesKey!==Math.round(cam.tx)+','+Math.round(cam.ty)))rebuildTrees();
 if(houseVer!==builtHouseVer&&(frames%15==0||houseVer-builtHouseVer>3))rebuildHouses();
 const showH=cam.alt<1200;for(const k in houseMeshes)houseMeshes[k].visible=showH;for(const k in templeMeshes)templeMeshes[k].visible=showH;roads.visible=cam.alt<1000&&cam.alt>15;
 cityM.uniforms.uA.value=Math.min(1,Math.max(0,(cam.alt-80)/300));
 syncPeople(now/1000);updateFX(rdt);
 const camUp=camera.position.clone().normalize(),day=Math.max(0,Math.min(1,camUp.dot(sunDir)*3+.3)),low=Math.max(0,Math.min(1,1-(cam.alt-60)/700));hemi.intensity=.25+.75*day*low;
 scene.background.setRGB(.38*day*low,.6*day*low,.95*day*low);scene.fog.color.copy(scene.background);if(low>0){scene.fog.near=cam.alt*4+150;scene.fog.far=cam.alt*14+900}else{scene.fog.near=1e6;scene.fog.far=2e6}
 hemi.intensity=.18+.25*low*day;
 renderer.render(scene,camera);requestAnimationFrame(loop)}
newWorld();rebuildHeights();rebuildColors();drawMini();drawHUD();requestAnimationFrame(loop);
window.GB={_lines:()=>[tradeL,powerL].map(L=>{const A=L.geometry.attributes.position.array,n=L.geometry.drawRange.count;let mn=1e9,mx=0,bad=0;for(let i=0;i<n;i++){const r=Math.hypot(A[i*3],A[i*3+1],A[i*3+2]);if(!isFinite(r))bad++;else{mn=Math.min(mn,r);mx=Math.max(mx,r)}}return{n,mn,mx,bad}}),_drawTest:l=>drawLines(tradeL,l,1.2),registerLayer:l=>{HK.layer=l;civRefresh();houseVer++;log('A civilization layer awakens.')},HK,openCodex,get civ(){return civ},get MW(){return MW},TW,TH,tidx,at,dist,near,get histAll(){return histAll},get fallen(){return fallen},get P(){return P},get kings(){return kings},get houses(){return houses},get yr(){return yr},cam,flyTo,act:(x,y,t)=>{const o=tool;tool=t;act(x,y,true);tool=o},setSpeed:s=>{speed=s},select:p=>{sel=p},toggleFollow,get fps(){return fps},level,mind,save,load,setSun:a=>{simT=a/.004},sunOver:(x,y,day)=>{sunLock=x==null?null:dirOf(x,y,new THREE.Vector3()).multiplyScalar(day?1:-1).add(new THREE.Vector3(0,.15,0)).normalize()},assets:AS.real,get deaths(){return deathCauses},get births(){return births},minds:mind.real};
